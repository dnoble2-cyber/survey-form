<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Survey Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Interactive Survey Form</h1>

  <form id="surveyForm">
    <!-- Task 1: basic form inputs -->
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>
    <span class="error-message" id="nameError"></span>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <span class="error-message" id="emailError"></span>

    <button type="submit">Submit</button>
  </form>

  <!-- choice based inputs -->
  <p>1. What is your preferred contact method?</p>

  <!-- radio button group (Single Choice) -->
  <input type="radio" id="contactEmail" name="contactMethod" value="Email" required>
  <label for="contactEmail">Email</label>

  <input type="radio" id="contactPhone" name="contactMethod" value="Phone">
  <label for="contactPhone">Phone</label>

  <input type="radio" id="contactText" name="contactMethod" value="Text Message">
  <label for="contactText">Text Message</label>
  <span class="error-message" id="contactMethodError"></span>

  <p>2. Which topics are you interested in? (Select all that apply)</p>

  <!-- checkbox group (Multiple Choices) -->
  <input type="checkbox" id="topicHTML" name="topics" value="HTML">
  <label for="topicHTML">HTML</label>

  <input type="checkbox" id="topicCSS" name="topics" value="CSS">
  <label for="topicCSS">CSS</label>

  <input type="checkbox" id="topicJS" name="topics" value="JavaScript">
  <label for="topicJS">JavaScript</label>
  <span class="error-message" id="topicsError"></span>

  <button type="submit">Submit</button>
</form>

<!-- dropdown menu section -->
<div class="form-section">
  <label for="visitFrequency">How often do you visit web development websites?</label>
  <select id="visitFrequency" name="visitFrequency" required>
    <option value="" disabled selected>-- Please select an option --</option>
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
    <option value="rarely">Rarely</option>
  </select>
  <span class="error-message" id="visitFrequencyError"></span>
</div>

<!-- regex validation field -->
<div class="form-section">
  <label for="webUserId">Create Your Web User ID (Format: WEB-1234):</label>
  <input 
    type="text" 
    id="webUserId" 
    name="webUserId" 
    placeholder="WEB-1234" 
    pattern="^WEB-[0-9]{4}$" 
    title="Enter an ID in the format WEB-1234" 
    required 
  />
  <span class="error-message" id="webUserIdError"></span>
</div>

<!-- date input -->
<div class="form-section">
  <label for="lastVisit">When did you last visit a web development website?</label>
  <input type="date" id="lastVisit" name="lastVisit" required />
  <span class="error-message" id="lastVisitError"></span>
</div>

<!-- number input -->
<div class="form-section">
  <label for="confidenceLevel">On a scale of 1–10, how confident are you with web technologies?</label>
  <input type="number" id="confidenceLevel" name="confidenceLevel" min="1" max="10" required />
  <span class="error-message" id="confidenceLevelError"></span>
</div>

  <script src="script.js"></script>
</body>
</html>
